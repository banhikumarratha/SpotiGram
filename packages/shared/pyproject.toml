[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotigram-shared"
version = "0.1.0"
description = "Shared utilities, config, and logging for SpotiGram services"
authors = [
    { name = "SpotiGram Team" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0"
]
