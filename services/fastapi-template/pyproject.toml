[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-template"
version = "0.1.0"
description = "Template service for FastAPI microservices in SpotiGram"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "spotigram-shared @ file://../../packages/shared"
]
