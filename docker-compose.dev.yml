version: '3.8'

services:
  # -----------------------------------
  # Application Services
  # -----------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./services/api-gateway:/app
      - ./packages:/packages
    depends_on:
      - redis
      - kafka

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/userdb
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - ./services/user-service:/app
      - ./packages:/packages
    depends_on:
      - postgres
      - kafka

  music-service:
    build:
      context: .
      dockerfile: services/music-service/Dockerfile
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/musicdb
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./services/music-service:/app
      - ./packages:/packages
    depends_on:
      - postgres
      - kafka

  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    environment:
      - ENVIRONMENT=development
      - CHROMA_DB_URL=http://chromadb:8000
    volumes:
      - ./services/recommendation-service:/app
      - ./packages:/packages
    depends_on:
      - chromadb
      - kafka

  ai-assistant-service:
    build:
      context: .
      dockerfile: services/ai-assistant-service/Dockerfile
    environment:
      - ENVIRONMENT=development
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./services/ai-assistant-service:/app
      - ./packages:/packages
    depends_on:
      - ollama
      - redis
      - kafka

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./services/analytics-service:/app
      - ./packages:/packages
    depends_on:
      - kafka

  streamlit-ui:
    build:
      context: .
      dockerfile: apps/streamlit-ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=development
      - AUTH_SERVICE_URL=http://user-service:8000
      - SPOTIFY_SERVICE_URL=http://music-service:8000
      - MOOD_SERVICE_URL=http://recommendation-service:8000
      - AI_SERVICE_URL=http://ai-assistant-service:8000
      - ANALYTICS_SERVICE_URL=http://analytics-service:8000
    volumes:
      - ./apps/streamlit-ui:/app
      - ./packages:/packages
    depends_on:
      - api-gateway

  # -----------------------------------
  # Infrastructure Services
  # -----------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_MULTIPLE_DATABASES=userdb,musicdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - CLUSTER_ID=Mk3OEYBSD34fcwNTJENDM2Qk
    volumes:
      - kafkadata:/tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      - kafka
    command: >
      bash -c "
        echo 'Waiting for Kafka...' &&
        sleep 10 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic user.events.v1 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic music.events.v1 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic outbox.events &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic spotigram.dlq &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic spotigram.retry
      "

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  # Observability
  otel-collector:
    image: otel/opentelemetry-collector:latest
    ports:
      - "4317:4317" # OTLP gRPC
      - "8889:8889" # Prometheus metrics

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  redisdata:
  kafkadata:
  chromadata:
  ollamadata:
